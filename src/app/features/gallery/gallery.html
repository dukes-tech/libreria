<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6">

  @for (libro of libros(); track libro.id) {

    <div
      class="bg-white rounded-xl shadow-md overflow-hidden
             hover:shadow-xl hover:-translate-y-1
             transition-all duration-300"
    >
      <div class="h-80 bg-gray-100 overflow-hidden">
        <img
          class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
          [src]="libro.formats['image/jpeg']"
          [alt]="libro.title"
        />
      </div>
      <div class="p-5">
        <h2 class="text-xl font-bold text-gray-800 mb-2 line-clamp-2">
          {{ libro.title }}
        </h2>

        <p class="text-sm font-semibold text-blue-600 mb-3">
          {{ libro.authors[0].name }}
        </p>

        <p class="text-sm text-gray-600 line-clamp-4">
          {{ libro.summaries }}
        </p>

      </div>

    </div>

  }

</div>
